controller_manager:
  ros__parameters:
    update_rate: 50 # Hz

    underliftbot_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lift_position_controller:
      type: position_controllers/JointGroupPositionController

underliftbot_controller:
  ros__parameters:
    type        : diff_drive_controller/DiffDriveController
    use_stamped_vel: true
    left_wheel_names  : ['base_left_wheel_joint']
    right_wheel_names : ['base_right_wheel_joint']

    publish_rate: 20.0               # default: 50
    # pose_covariance_diagonal : [0.001, 0.001, 1.0e-3, 1.0e-3, 1.0e-3, 0.01]
    # twist_covariance_diagonal: [0.001, 0.001, 1.0e-3, 1.0e-3, 1.0e-3, 0.01]

    wheel_separation : 0.43
    wheel_radius : 0.05

    # Velocity commands timeout [s], default 0.5
    cmd_vel_timeout: 0.5
    # open_loop: true
    # Base frame_id
    base_frame_id: base_footprint #default: base_link

    # Publish limited velocity
    publish_limited_velocity: true

    # Publish wheel data
    publish_wheel_data: true

    wheel_separation_multiplier: 1.1
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # wheel_separation_multiplier: 1.0
    # left_wheel_radius_multiplier: 1.0
    # right_wheel_radius_multiplier: 1.0

    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    enable_odom_tf: true
    #publish_limited_velocity: true
    #velocity_rolling_window_size: 10

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 5.0
    linear.x.max_jerk: .NAN
    linear.x.min_jerk: .NAN

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 5.0
    angular.z.min_velocity: -5.0
    angular.z.max_acceleration: 5.0
    angular.z.min_acceleration: -5.0
    angular.z.max_jerk: .NAN
    angular.z.min_jerk: .NAN

lift_position_controller:
  ros__parameters:
    joints: ["lift_joint"]
    command_interfaces: ["position"]
    state_interfaces: ["position", "velocity"]